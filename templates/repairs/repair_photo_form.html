{% extends "base.html" %}
{% load repair_extras %}

{% block title %}
    <title>Agregar foto</title>
{% endblock %}

{% block head %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/repairs.css' %}">
{% endblock %}
{% block content %}
    <h1>Agregar foto</h1>

    <p>
        <strong>Reparación:</strong>
        {{ repair.repair_type }}
    </p>

    <p>
        <strong>Propiedad:</strong>
        {{ repair.property }}
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="photo">Seleccionar foto</label>
        <br><br>

        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Subir foto
        </button>
    </form>

    <br>

    <a href="{% url 'repair_detail' repair.id %}">
        Cancelar
    </a>

{% endblock %}
