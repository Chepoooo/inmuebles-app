<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reparaciones</title>
</head>
<body>

    <h1>Reparaciones</h1>

    <a href="{% url 'repair_create' %}">
        Crear reparación
    </a>

    <hr>

    {% for repair in repairs %}
        <div>
            <h2>
                <a href="{% url 'repair_detail' repair.id %}">
                    {{ repair.repair_type }}
                </a>
            </h2>

            <p>
                Propiedad: {{ repair.property }}
            </p>

            <p>
                Estado: {{ repair.get_status_display }}
            </p>

            <p>
                Fecha: {{ repair.report_date|date:"d/m/Y" }}
            </p>
        </div>

        <hr>
    {% empty %}
        <p>No hay reparaciones registradas.</p>
    {% endfor %}

</body>
</html>
