{% extends "base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}

    <h1>{{ title }}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>
    </form>

    <a href="{% url 'property_list' %}">
        Cancelar
    </a>

{% endblock %}
