<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title|default:"Agregar característica" }}</title>
</head>
<body>

    <h1>
        {{ title|default:"Agregar característica" }}
    </h1>

    <h2>
        {{ section.name }}
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>

    </form>

    <br>

    <a href="{% url 'inventory_detail' section.inventory.id %}">
        Cancelar
    </a>

</body>
</html>
