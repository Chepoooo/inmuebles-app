{% extends "base.html" %}

{% block title %}
    Agregar sección
{% endblock %}

{% block content %}

    <h1>
        Agregar sección
    </h1>

    <h2>
        {{ inventory.property.name }}
    </h2>

    <p>
        Inventario:
        {{ inventory.get_inventory_type_display }}
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Crear sección
        </button>

    </form>

    <br>

    <a href="{% url 'inventory_detail' inventory.id %}">
        Cancelar
    </a>

{% endblock %}
