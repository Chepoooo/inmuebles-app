<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar foto</title>
</head>
<body>

    <h1>Eliminar foto</h1>

    <p>
        ¿Estás seguro de que quieres eliminar esta foto?
    </p>

    <img
        src="{{ photo.secure_url }}"
        alt="Foto de {{ photo.item.name }}"
        width="300"
    >

    <br><br>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

    <br>

    <a href="{% url 'inventory_detail' photo.item.section.inventory.id %}">
        Cancelar
    </a>

</body>
</html>
