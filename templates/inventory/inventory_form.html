{% extends "base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}

    <h1>{{ title }}</h1>

    <h2>{{ property.name }}</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>

    </form>

    <a href="{% url 'inventory_list' property.id %}">
        Cancelar
    </a>

{% endblock %}
