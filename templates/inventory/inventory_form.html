<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>

    <h1>{{ title }}</h1>

    <h2>{{ property.name }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar
        </button>
    </form>

    <a href="{% url 'inventory_list' property.id %}">
        Cancelar
    </a>

</body>
</html>
