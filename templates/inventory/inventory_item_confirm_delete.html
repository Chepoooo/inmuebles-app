<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar característica</title>
</head>
<body>

    <h1>Eliminar característica</h1>

    <p>
        ¿Estás seguro de que deseas eliminar
        <strong>{{ item.name }}</strong>?
    </p>

    <p>
        Esta acción no se puede deshacer.
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

        <a href="{% url 'inventory_detail' item.section.inventory.id %}">
            Cancelar
        </a>
    </form>

</body>
</html>
