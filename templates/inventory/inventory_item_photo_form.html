<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar foto</title>
</head>
<body>

    <h1>Agregar foto</h1>

    <h2>{{ item.name }}</h2>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        <input
            type="file"
            name="photo"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Subir foto
        </button>

    </form>

    <br>

    <a href="{% url 'inventory_detail' item.section.inventory.id %}">
        Cancelar
    </a>

</body>
</html>
