<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de permisos</title>
</head>
<body>

    <h1>Prueba de permisos</h1>

    <p>
        <strong>Usuario:</strong>
        {{ request.user.username }}
    </p>

    <p>
        <strong>Organización:</strong>
        {{ organization.name }}
    </p>

    <p>
        <strong>Rol:</strong>
        {{ membership.get_role_display }}
    </p>

    <p>
        Si puedes ver esta página, tienes permiso de administrador.
    </p>

</body>
</html>
