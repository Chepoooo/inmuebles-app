
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Inmuebles{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    {% if user.is_authenticated %}

        <header class="site-header">

            <nav class="main-nav">

                <div class="nav-brand">
                    <a href="{% url 'property_list' %}">
                        Inmuebles
                    </a>
                </div>

                <div class="nav-links">

                    <a href="{% url 'property_list' %}">
                        Propiedades
                    </a>

                    <a href="{% url 'repair_list' %}">
                        Reparaciones
                    </a>

                    <a href="{% url 'inventory_dashboard' %}">
                        Inventarios
                    </a>

                </div>

                <div class="nav-user">

                    <span class="nav-username">
                        {{ user.username }}
                    </span>

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                        onsubmit="return confirm('¿Estás seguro de que deseas cerrar sesión?');"
                    >
                        {% csrf_token %}

                        <button type="submit" class="logout-button">
                            Cerrar sesión
                        </button>
                    </form>

                </div>

            </nav>

        </header>

    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
