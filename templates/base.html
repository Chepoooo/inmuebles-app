<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Inmuebles{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    {% if user.is_authenticated %}

        <header>
            <nav>

                <a href="{% url 'property_list' %}">
                    Propiedades
                </a>

                <a href="{% url 'repair_list' %}">
                    Reparaciones
                </a>

                <a href="{% url 'inventory_dashboard' %}">
                    Inventarios
                </a>

                <span>
                    {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">
                        Cerrar sesión
                    </button>
                </form>

            </nav>
        </header>

    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
