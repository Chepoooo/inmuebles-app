<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Inmuebles{% endblock %}</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>

    {% if user.is_authenticated %}
    <header class="site-header">
        <nav class="main-nav">

            <div class="nav-brand">
                <a href="{% url 'property_list' %}">Inmuebles</a>
            </div>

            <div class="nav-links">
                <a href="{% url 'property_list' %}">Propiedades</a>
                <a href="{% url 'repair_list' %}">Reparaciones</a>
                <a href="{% url 'inventory_dashboard' %}">Inventarios</a>
            </div>

            <div class="nav-user">

                <div class="nav-user-profile">
                    <div class="nav-user-avatar" aria-hidden="true">
                        {{ user.username|first|upper }}
                    </div>

                    <div class="nav-user-info">
                        <span class="nav-user-label">Sesión iniciada</span>
                        <span class="nav-username">{{ user.username }}</span>
                    </div>
                </div>

                <form
                    class="nav-logout-form"
                    method="post"
                    action="{% url 'logout' %}"
                    onsubmit="return confirm('¿Estás seguro de que deseas cerrar sesión?');"
                >
                    {% csrf_token %}

                    <button type="submit" class="logout-button">
                        <span class="logout-icon" aria-hidden="true">↪</span>
                        <span>Cerrar sesión</span>
                    </button>
                </form>

            </div>

        </nav>
    </header>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
